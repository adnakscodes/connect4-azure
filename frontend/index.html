<!DOCTYPE html>
<html>
<head>
    <title>Connect 4</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .board {
            display: grid;
            grid-template-columns: repeat(7, 50px);
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }
        .cell {
            width: 50px;
            height: 50px;
            background: #ddd;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<h1>Connect 4</h1>

<button onclick="createGame()">Create Game</button>
<br><br>

<input id="gameIdInput" placeholder="Enter Game ID">
<button onclick="joinGame()">Join Game</button>

<h3 id="status"></h3>

<div id="board" class="board"></div>

<script>
const API = "https://deploymentaa-gmggejfjcvhmcada.southeastasia-01.azurewebsites.net/api";

let currentGameId = null;
let currentPlayer = null;

// Create game
async function createGame() {
    const res = await fetch(API + "/createGame", { method: "POST" });
    const data = await res.json();

    currentGameId = data.gameId;
    currentPlayer = data.playerId;

    document.getElementById("status").innerText =
        "Game ID: " + data.gameId + " | You are " + data.playerId;

    pollGame();
}

// Join game
async function joinGame() {
    const gameId = document.getElementById("gameIdInput").value;

    const res = await fetch(API + "/joinGame", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ gameId })
    });

    const data = await res.json();

    currentGameId = gameId;
    currentPlayer = data.playerId;

    document.getElementById("status").innerText =
        "Game ID: " + gameId + " | You are " + data.playerId;

    pollGame();
}

// Poll game state
async function pollGame() {
    setInterval(async () => {
        if (!currentGameId) return;

        const res = await fetch(API + "/getGame?gameId=" + currentGameId);
        const game = await res.json();

        renderBoard(game.board);
    }, 2000);
}

// Render board
function renderBoard(board) {
    const boardDiv = document.getElementById("board");
    boardDiv.innerHTML = "";

    board.forEach(row => {
        row.forEach(cell => {
            const div = document.createElement("div");
            div.className = "cell";

            if (cell === 1) div.style.background = "red";
            if (cell === 2) div.style.background = "yellow";

            boardDiv.appendChild(div);
        });
    });
}
</script>

</body>
</html>
