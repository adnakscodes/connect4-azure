<!DOCTYPE html>
<html>
<head>
    <title>Connect 4</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0b1b2b;
            color: white;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, 70px);
            gap: 8px;
            justify-content: center;
            margin-top: 25px;
            background: #0044cc;
            padding: 10px;
            border-radius: 10px;
        }

        .cell {
            width: 70px;
            height: 70px;
            background: #001f5c;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .piece {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: absolute;
            left: 5px;
        }

        .p1 { background: red; }
        .p2 { background: yellow; }

        /* 🔥 DROP ANIMATION */
        @keyframes drop {
            from {
                transform: translateY(-500px);
            }
            to {
                transform: translateY(0);
            }
        }

        .drop {
            animation: drop 0.4s ease-out;
        }

        .status {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h1>Connect 4</h1>

<button onclick="createGame()">Create Game</button>
<br><br>

<input id="gameIdInput" placeholder="Enter Game ID">
<button onclick="joinGame()">Join Game</button>

<div class="status" id="status"></div>
<div class="status" id="turn"></div>

<div id="board" class="board"></div>

<script>
const API = "https://deploymentaa-gmggejfjcvhmcada.southeastasia-01.azurewebsites.net/api";

let currentGameId = null;
let currentPlayer = null;
let currentTurn = null;
let winner = null;
let previousBoard = null;

// Create game
async function createGame() {
    const res = await fetch(API + "/createGame", { method: "POST" });
    const data = await res.json();

    currentGameId = data.gameId;
    currentPlayer = data.playerId;

    document.getElementById("status").innerText =
        "Game ID: " + data.gameId + " | You are " + data.playerId;

    pollGame();
}

// Join game
async function joinGame() {
    const gameId = document.getElementById("gameIdInput").value;

    const res = await fetch(API + "/joinGame", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ gameId })
    });

    const data = await res.json();

    currentGameId = gameId;
    currentPlayer = data.playerId;

    document.getElementById("status").innerText =
        "Game ID: " + gameId + " | You are " + data.playerId;

    pollGame();
}

// Make move
async function makeMove(column) {
    if (!currentGameId || !currentPlayer || winner) return;

    await fetch(API + "/makeMove", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            gameId: currentGameId,
            column,
            playerId: currentPlayer
        })
    });
}

// Poll game
function pollGame() {
    setInterval(async () => {
        if (!currentGameId) return;

        const res = await fetch(API + "/getGame?gameId=" + currentGameId);
        const game = await res.json();

        currentTurn = game.currentTurn;
        winner = game.winner;

        updateStatus();
        renderBoard(game.board);
    }, 1000);
}

// Update UI status
function updateStatus() {
    const turnDiv = document.getElementById("turn");

    if (winner) {
        turnDiv.innerText = winner + " wins 🎉";
    } else {
        turnDiv.innerText = "Current Turn: " + currentTurn;
    }
}

// Render board with animation
function renderBoard(board) {
    const boardDiv = document.getElementById("board");
    boardDiv.innerHTML = "";

    for (let r = 0; r < board.length; r++) {
        for (let c = 0; c < board[r].length; c++) {

            const cell = document.createElement("div");
            cell.className = "cell";

            cell.onclick = () => makeMove(c);

            const value = board[r][c];

            if (value !== 0) {
                const piece = document.createElement("div");
                piece.className = "piece " + (value === 1 ? "p1" : "p2");

                // 🔥 Apply animation only if new piece
                if (!previousBoard || previousBoard[r][c] === 0) {
                    piece.classList.add("drop");
                }

                cell.appendChild(piece);
            }

            boardDiv.appendChild(cell);
        }
    }

    // Save for next comparison
    previousBoard = JSON.parse(JSON.stringify(board));
}
</script>

</body>
</html>
